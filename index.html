<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детский клуб «Эврика» — Харьков</title>
    
    <!-- Скрипт Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Шрифты Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700;800;900&family=Montserrat+Alternates:wght@700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Конфигурация Tailwind и кастомные стили -->
    <script src="css/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-yellow selection:text-navy page-home-active">

    <!-- Фиксированный фон сайта — привязан к низу экрана, не скачет на мобильных устройствах при скрытии адресной строки -->
    <div id="site-bg" class="site-bg" aria-hidden="true"></div>

    <!-- Главный контейнер приложения -->
    <div id="app-wrapper" class="w-full max-w-6xl mx-auto min-h-screen flex flex-col justify-between relative overflow-hidden z-10">
        
        <!-- Декоративные фоновые пятна в углах (как на референсе) -->
        <div class="pointer-events-none absolute -bottom-16 -left-16 w-64 h-64 rounded-full bg-[#E3F1FE] opacity-75 blur-xl z-0"></div>
        <div class="pointer-events-none absolute -bottom-16 -right-12 w-56 h-56 rounded-full bg-[#FEF0C7] opacity-80 blur-xl z-0"></div>
        <div class="pointer-events-none absolute top-32 -right-20 w-48 h-48 rounded-full bg-[#DCFCE7] opacity-50 blur-2xl z-0"></div>

        <!-- ШАПКА САЙТА (с аккуратно закруглёнными нижними краями) -->
        <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md px-5 py-3.5 md:px-8 md:py-4 border-b border-x border-slate-200/50 rounded-b-[24px] sm:rounded-b-[28px] shadow-xs">
            <div class="flex items-center justify-between">
                <!-- Логотип (увеличен на 30%) -->
                <a href="#home" onclick="navigateTo('home'); return false;" class="group flex flex-col items-start focus:outline-none">
                    <div class="font-logo text-[31px] md:text-[39px] font-extrabold tracking-tight leading-none logo-text">
                        <span>Э</span><span>в</span><span>р</span><span>и</span><span>к</span><span>а</span>
                    </div>
                    <span class="text-[14px] md:text-[16px] font-bold text-navy/70 tracking-wide mt-0.5 pl-0.5 group-hover:text-navy transition">
                        детский клуб
                    </span>
                </a>

                <!-- Десктопная навигация (скрыта на мобильных и в режиме мобильного фрейма) -->
                <nav id="desktop-nav" class="hidden lg:flex items-center gap-1 xl:gap-2">
                    <button onclick="navigateTo('home')" data-nav="home" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Главная</button>
                    <button onclick="navigateTo('about')" data-nav="about" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">О клубе</button>
                    <button onclick="navigateTo('program')" data-nav="program" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Программа</button>
                    <button onclick="navigateTo('clubs')" data-nav="clubs" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Кружки</button>
                    <button onclick="navigateTo('calendar')" data-nav="calendar" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Календарь</button>
                    <button onclick="navigateTo('gallery')" data-nav="gallery" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Галерея</button>
                    <button onclick="navigateTo('teachers')" data-nav="teachers" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Воспитатели</button>
                    <button onclick="navigateTo('contacts')" data-nav="contacts" class="nav-pill px-3 py-1.5 rounded-full text-sm font-bold transition">Контакты</button>
                </nav>

                <!-- Правый блок: Инстаграм + Прямой звонок + Записаться + Кнопка мобильного меню -->
                <div class="flex items-center gap-1.5 sm:gap-2.5">
                    <!-- Иконка Instagram -->
                    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram клуба" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-pink-50 hover:text-[#E1306C] text-[#E1306C] flex items-center justify-center transition active:scale-90 shadow-sm shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                        </svg>
                    </a>

                    <!-- Прямой звонок по телефону (сразу звонит, не переходит на контакты) -->
                    <a href="tel:+38090000000" aria-label="Позвонить в детский клуб" class="w-9 h-9 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-600 flex items-center justify-center transition active:scale-90 shadow-sm shrink-0">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z"/>
                        </svg>
                    </a>

                    <!-- Кнопка записи на ПК -->
                    <button onclick="openBookingModal('Запись в детский клуб')" id="desktop-cta" class="hidden sm:inline-flex items-center gap-1.5 bg-brand-yellow hover:bg-brand-yellowHover text-navy font-bold text-xs md:text-sm px-4 py-2 rounded-full shadow-sm transition transform active:scale-95">
                        <span>Записаться</span>
                    </button>

                    <!-- Кнопка открытия мобильного меню (гамбургер) -->
                    <button onclick="toggleMenuDrawer()" id="menu-toggle-btn" aria-label="Открыть меню" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center text-navy hover:bg-navy/5 active:bg-navy/10 transition shrink-0">
                        <!-- Иконка гамбургера -->
                        <svg id="icon-hamburger" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        <!-- Иконка крестика -->
                        <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- ВЫЕЗЖАЮЩЕЕ МЕНЮ: РАСТЯНУТО ПРАКТИЧЕСКИ НА ВЕСЬ ЭКРАН, В ОДНОЙ ПЛОСКОСТИ С ТАБ-БАРОМ, ЧУТЬ ВЫШЕ НЕГО -->
        <div id="mobile-menu-drawer" class="hidden fixed inset-0 z-50 bg-navy/45 backdrop-blur-md items-start justify-center" onclick="if(event.target === this) toggleMenuDrawer(false)">
            <div id="mobile-menu-card" class="bg-white rounded-[30px] shadow-floating border border-slate-100 flex flex-col justify-between relative animate-[fadeIn_0.2s_ease-out]">
                <!-- Верхняя строка: только аккуратная кнопка закрытия справа -->
                <div class="flex items-center justify-end pb-1 shrink-0">
                    <button onclick="toggleMenuDrawer(false)" aria-label="Закрыть меню" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-navy transition active:scale-90">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Список пунктов меню, равномерно распределенный по высоте -->
                <nav class="flex-1 flex flex-col justify-around py-1 sm:py-2 space-y-1 sm:space-y-1.5 overflow-y-auto no-scrollbar" id="mobile-menu-list">
                    <!-- Заполняется динамически скриптом -->
                </nav>
            </div>
        </div>

        <!-- ВСЕ РАЗДЕЛЫ ОДНОСТРАНИЧНОГО САЙТА -->
        <main id="main-content" class="flex-1 relative z-10 w-full">
            <!-- Все секции рендерятся последовательно скриптом js/app.js -->
        </main>

        <!-- НИЖНЯЯ ПАНЕЛЬ ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ (для быстрого перехода по разделам на ПК) -->
        <footer id="site-footer" class="relative z-20 mt-auto border-t border-slate-200/60 bg-white/70 backdrop-blur-md px-4 py-2.5 md:px-8 hidden">
            <div class="flex flex-col md:flex-row items-center justify-between gap-3">
                <div class="w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                    <div class="flex items-center gap-1.5 min-w-max mx-auto justify-center" id="screen-switcher-bar">
                        <!-- Генерируется скриптом -->
                    </div>
                </div>
                <div class="text-[11px] text-navy/60 font-medium text-center md:text-right">
                    © Детский клуб «Эврика», г. Харьков, ул. Любови Малой, 22
                </div>
            </div>
        </footer>

        <!-- ПРИКЛЕЕННОЕ НИЖНЕЕ МЕНЮ (Плавающий айфоновский таббар с полным скруглением) -->
        <nav id="bottom-nav-bar" class="fixed z-40 bg-white rounded-[30px] sm:rounded-[36px] shadow-[0_10px_30px_rgba(30,58,95,0.16)] border border-slate-200/80 px-4 py-2">
            <div class="max-w-md mx-auto grid grid-cols-4 items-center text-center">
                <!-- 1. Главная (Домик точно как в верхней плашке «О клубе») -->
                <button onclick="navigateTo('home')" id="bnav-home" class="flex flex-col items-center justify-center py-1 group transition cursor-pointer">
                    <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 transition">
                        <svg class="w-6 h-6 drop-shadow-sm" viewBox="0 0 24 24" fill="none">
                            <rect x="16.5" y="4" width="2.5" height="5" rx="0.6" fill="#0284C7"/>
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.8c-.4 0-.8.2-1.1.5L2.4 10.8c-.5.5-.4 1.3.1 1.8.5.4 1.3.4 1.8-.1L5 11.8V19c0 1.4 1.1 2.5 2.5 2.5h9c1.4 0 2.5-1.1 2.5-2.5v-7.2l.7.7c.5.5 1.3.5 1.8.1.5-.5.6-1.3.1-1.8L13.1 3.3c-.3-.3-.7-.5-1.1-.5zM9.5 21.5h5v-4.5c0-1.4-1.1-2.5-2.5-2.5s-2.5 1.1-2.5 2.5v4.5z" fill="#0284C7"/>
                        </svg>
                    </div>
                    <span class="bnav-label text-[11px] font-bold text-navy mt-1">Главная</span>
                </button>

                <!-- 2. Кружки (Пазл точно как в верхней плашке «Кружки») -->
                <button onclick="navigateTo('clubs')" id="bnav-clubs" class="flex flex-col items-center justify-center py-1 group transition cursor-pointer">
                    <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 transition">
                        <svg class="w-6 h-6 drop-shadow-sm" viewBox="0 0 24 24" fill="none">
                            <path fill="#F97316" d="M7 5.5 L9.5 5.5 C9.5 3.5, 10.3 2, 12 2 C13.7 2, 14.5 3.5, 14.5 5.5 L17 5.5 C17.8 5.5, 18.5 6.2, 18.5 7 L18.5 9.5 C20.5 9.5, 22 10.3, 22 12 C22 13.7, 20.5 14.5, 18.5 14.5 L18.5 17 C18.5 17.8, 17.8 18.5, 17 18.5 L14.5 18.5 C14.5 16.5, 13.7 15, 12 15 C10.3 15, 9.5 16.5, 9.5 18.5 L7 18.5 C6.2 18.5, 5.5 17.8, 5.5 17 L5.5 14.5 C7.5 14.5, 9 13.7, 9 12 C9 10.3, 7.5 9.5, 5.5 9.5 L5.5 7 C5.5 6.2, 6.2 5.5, 7 5.5 Z"/>
                        </svg>
                    </div>
                    <span class="bnav-label text-[11px] font-bold text-navy mt-1">Кружки</span>
                </button>

                <!-- 3. Календарь (Календарь точно как в верхней плашке «Календарь») -->
                <button onclick="navigateTo('calendar')" id="bnav-calendar" class="flex flex-col items-center justify-center py-1 group transition cursor-pointer">
                    <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 transition">
                        <svg class="w-6 h-6 drop-shadow-sm" viewBox="0 0 24 24" fill="none">
                            <rect x="7" y="1.5" width="2" height="4" rx="1" fill="#06B6D4"/>
                            <rect x="15" y="1.5" width="2" height="4" rx="1" fill="#06B6D4"/>
                            <rect x="2.5" y="3.5" width="19" height="18" rx="3.5" fill="#06B6D4"/>
                            <rect x="2.5" y="8.5" width="19" height="1.8" fill="#FFFFFF"/>
                            <circle cx="6.5" cy="12.5" r="1.1" fill="#FFFFFF"/>
                            <circle cx="12" cy="12.5" r="1.1" fill="#FFFFFF"/>
                            <circle cx="17.5" cy="12.5" r="1.1" fill="#FFFFFF"/>
                            <circle cx="6.5" cy="16.5" r="1.1" fill="#FFFFFF"/>
                            <circle cx="12" cy="16.5" r="1.1" fill="#FFFFFF"/>
                            <circle cx="17.5" cy="16.5" r="1.1" fill="#FFFFFF"/>
                        </svg>
                    </div>
                    <span class="bnav-label text-[11px] font-bold text-navy mt-1">Календарь</span>
                </button>

                <!-- 4. Профиль (Гармоничный силуэт в едином насыщенном стиле) -->
                <button onclick="openProfileModal()" id="bnav-profile" class="flex flex-col items-center justify-center py-1 group transition cursor-pointer">
                    <div class="w-7 h-7 flex items-center justify-center group-hover:scale-110 transition">
                        <svg class="w-6 h-6 drop-shadow-sm" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="7" r="4.2" fill="#FB7185"/>
                            <path d="M4 20.5c0-4 3.6-7 8-7s8 3 8 7v.5H4v-.5z" fill="#FB7185"/>
                        </svg>
                    </div>
                    <span class="bnav-label text-[11px] font-bold text-navy mt-1">Профиль</span>
                </button>
            </div>
        </nav>


    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗАПИСИ / ОБРАТНОЙ СВЯЗИ -->
    <div id="booking-modal" class="hidden fixed inset-0 z-[70] bg-navy/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-milk w-full max-w-md rounded-3xl shadow-floating border border-white p-6 relative animate-[fadeIn_0.2s_ease-out]">
            <button onclick="closeBookingModal()" aria-label="Закрыть" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-navy/70 hover:text-navy">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>

            <div class="flex items-center gap-3 mb-4">
                <div class="w-11 h-11 rounded-2xl bg-pastel-yellow flex items-center justify-center text-amber-500">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2l2.4 7.4h7.6l-6 4.6 2.3 7-6.3-4.6-6.3 4.6 2.3-7-6-4.6h7.6z"/>
                    </svg>
                </div>
                <div>
                    <h3 id="modal-title" class="text-lg font-extrabold text-navy">Записаться на занятие</h3>
                    <p id="modal-subtitle" class="text-xs text-navy/70">Оставьте контакты, и мы перезвоним вам в течение 15 минут</p>
                </div>
            </div>

            <form id="booking-form" onsubmit="submitBookingForm(event)" class="space-y-3.5">
                <input type="hidden" id="booking-subject" value="Общая запись">
                
                <div>
                    <label class="block text-xs font-bold text-navy/80 mb-1">Ваше имя (Родитель) *</label>
                    <input type="text" id="parent-name" required placeholder="Например, Елена" class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm text-navy focus:outline-none focus:border-brand-blue">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-navy/80 mb-1">Имя ребёнка</label>
                        <input type="text" id="child-name" placeholder="Миша" class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm text-navy focus:outline-none focus:border-brand-blue">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-navy/80 mb-1">Возраст ребёнка</label>
                        <select id="child-age" class="w-full px-3 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm text-navy focus:outline-none focus:border-brand-blue">
                            <option value="3 года">3 года</option>
                            <option value="4 года">4 года</option>
                            <option value="5 лет" selected>5 лет</option>
                            <option value="6 лет">6 лет</option>
                            <option value="7-8 лет">7–8 лет</option>
                            <option value="9-10 лет">9–10 лет</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-navy/80 mb-1">Телефон для связи *</label>
                    <input type="tel" id="parent-phone" required placeholder="+380 (__) ___-__-__" class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm text-navy focus:outline-none focus:border-brand-blue">
                </div>

                <div>
                    <label class="block text-xs font-bold text-navy/80 mb-1">Направление или вопрос</label>
                    <input type="text" id="booking-direction" placeholder="Пробное занятие / Консультация" class="w-full px-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm text-navy focus:outline-none focus:border-brand-blue">
                </div>

                <button type="submit" class="w-full py-3 rounded-full bg-brand-yellow hover:bg-brand-yellowHover text-navy font-extrabold text-sm shadow-sm transition transform active:scale-98">
                    Отправить заявку
                </button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЬНОЙ ИНФОРМАЦИИ (О кружке / воспитателе / фото) -->
    <div id="detail-modal" class="hidden fixed inset-0 z-[70] bg-navy/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="detail-modal-body" class="bg-milk w-full max-w-lg rounded-3xl shadow-floating border border-white overflow-hidden relative animate-[fadeIn_0.2s_ease-out]">
            <!-- Заполняется динамически через js/modals.js -->
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ (ТОСТ) -->
    <div id="toast-notification" class="fixed bottom-16 right-4 left-4 md:left-auto md:w-96 z-[70] pointer-events-none opacity-0 translate-y-4 transition-all duration-300">
        <div class="bg-navy text-white rounded-2xl p-4 shadow-floating flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-brand-green/20 text-brand-green flex items-center justify-center shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <div class="text-xs font-semibold leading-snug" id="toast-message">
                Заявка успешно отправлена!
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ МОДУЛЕЙ СКРИПТОВ -->
    <!-- 1. Данные и состояние -->
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/modals.js"></script>

    <!-- 2. Отдельные модули страниц (экранов) -->
    <script src="js/pages/home.js"></script>
    <script src="js/pages/about.js"></script>
    <script src="js/pages/program.js"></script>
    <script src="js/pages/clubs.js"></script>
    <script src="js/pages/teachers.js"></script>
    <script src="js/pages/gallery.js"></script>
    <script src="js/pages/calendar.js"></script>
    <script src="js/pages/reviews.js"></script>
    <script src="js/pages/contacts.js"></script>

    <!-- 3. Главный модуль навигации и запуска приложения -->
    <script src="js/app.js"></script>
</body>
</html>
